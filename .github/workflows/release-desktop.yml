
name: Build and publish ArcDraw Desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    name: Build Windows installer
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify desktop release version
        shell: pwsh
        run: |
          $version = (Get-Content desktop/package.json -Raw | ConvertFrom-Json).version

          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match desktop version v$version"
          }

          Write-Host "Desktop version: $version"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Build ArcDraw renderer
        working-directory: frontend
        run: npm run build:desktop

      - name: Install Electron dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Build Windows installer
        working-directory: desktop
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Find and normalize installer
        shell: pwsh
        run: |
          $dist = (Resolve-Path "desktop/dist").Path

          $installer = Get-ChildItem $dist -Filter "*.exe" -File |
            Where-Object { $_.Name -notmatch "uninstaller" } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if (-not $installer) {
            throw "Windows installer was not generated."
          }

          $target = Join-Path $dist "ArcDraw-Setup.exe"

          $sourcePath = [System.IO.Path]::GetFullPath($installer.FullName)
          $targetPath = [System.IO.Path]::GetFullPath($target)

          if (-not [string]::Equals(
            $sourcePath,
            $targetPath,
            [System.StringComparison]::OrdinalIgnoreCase
          )) {
            Copy-Item $sourcePath $targetPath -Force
          }

          if (-not (Test-Path $targetPath)) {
            throw "ArcDraw-Setup.exe was not found after normalization."
          }

          Write-Host "Installer ready:"
          Get-Item $targetPath | Format-List Name, Length, FullName

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArcDraw-Setup-${{ github.ref_name }}
          path: desktop/dist/ArcDraw-Setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ArcDraw Desktop ${{ github.ref_name }}
          generate_release_notes: true
          files: desktop/dist/ArcDraw-Setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
