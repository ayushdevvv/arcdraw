name: Build and publish ArcDraw Desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    name: Build Windows installer
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify release version
        shell: pwsh
        run: |
          $version = (Get-Content desktop/package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag does not match desktop version: v$version"
          }

      - name: Install web dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Build ArcDraw renderer
        working-directory: frontend
        run: npm run build:desktop

      - name: Install Electron dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Build Windows installer
        working-directory: desktop
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Normalize installer filename
        shell: pwsh
        run: |
          $installer = Get-ChildItem desktop/dist -Filter "*.exe" |
            Where-Object { $_.Name -notmatch "uninstaller" } |
            Select-Object -First 1

          if (-not $installer) {
            throw "Windows installer was not generated."
          }

          Copy-Item $installer.FullName "desktop/dist/ArcDraw-Setup.exe" -Force

          Get-Item "desktop/dist/ArcDraw-Setup.exe"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArcDraw-Setup-${{ github.ref_name }}
          path: desktop/dist/ArcDraw-Setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ArcDraw Desktop ${{ github.ref_name }}
          generate_release_notes: true
          files: desktop/dist/ArcDraw-Setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}